services:
  mysql:
    image: mysql:8.0
    container_name: eventify-mysql

    environment:
      # Without this the container runs on UTC, but the app's "must start
      # from tomorrow" rule is evaluated on the server's calendar day. On UTC
      # that boundary sits 5h45m later than Kathmandu's, so an event set for
      # e.g. 00:30 Kathmandu time on the next day was wrongly rejected.
      TZ: Asia/Kathmandu
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: event_planner
      MYSQL_USER: event_planner
      MYSQL_PASSWORD: devpass123

    ports:
      - "3307:3306"

    volumes:
      - eventify_mysql_data:/var/lib/mysql

    healthcheck:
      # -h 127.0.0.1 (not "localhost") is deliberate: it forces a TCP
      # connection, which is the path the backend actually uses. With
      # "localhost" the client dials a Unix socket, and on first run MySQL
      # listens there during its temporary init phase -- so the check would
      # report healthy before port 3306 was accepting connections, and
      # migrations would fail with ECONNREFUSED.
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "event_planner",
          "-pdevpass123",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      # MySQL's first-run initialisation is slow; failures inside this
      # window don't count against the retries above.
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eventify-backend

    environment:
      # Must match the app's real timezone. See the note on the mysql service.
      TZ: Asia/Kathmandu
      PORT: 4000
      NODE_ENV: development

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: event_planner
      DB_PASSWORD: devpass123
      DB_NAME: event_planner

      JWT_SECRET: YOUR_JWT_SECRET
      JWT_EXPIRES_IN: 1h

      COOKIE_NAME: ep_token
      COOKIE_SECURE: "false"

      FRONTEND_ORIGIN: http://localhost:5173

      CLOUDINARY_CLOUD_NAME: YOUR_CLOUDINARY_CLOUD_NAME
      CLOUDINARY_API_KEY: YOUR_CLOUDINARY_API_KEY
      CLOUDINARY_API_SECRET: YOUR_CLOUDINARY_API_SECRET

    ports:
      - "4000:4000"

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: eventify-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  eventify_mysql_data:
